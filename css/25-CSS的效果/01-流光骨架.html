<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
    }

    .product-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(200px, 1fr));
        gap: 20px;
    }

    .product-card {
        overflow: hidden;
    }

    .product-card--skeleton {
        pointer-events: none;
    }

    .product-card__media {
        position: relative;
        aspect-ratio: 1 / 0.82;
        padding: 14px;
        background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 48%),
                linear-gradient(180deg, #fbf5f0 0%, #f1e6dc 100%);
    }

    .product-card__media--skeleton {
        background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.7), transparent 48%),
                linear-gradient(180deg, #f8f2ec 0%, #efe3d8 100%);
    }

    .product-card__badge {
        position: absolute;
        top: 26px;
        left: 26px;
        z-index: 1;
        padding: 8px 12px;
        border-radius: 999px;
        color: #fff;
        background: rgba(36, 31, 28, 0.82);
        font-size: 12px;
        font-weight: 700;
    }

    .product-card__badge--skeleton {
        width: 74px;
        height: 32px;
        padding: 0;
        background: transparent;
    }

    .product-skeleton__image {
        width: 100%;
        height: 100%;
        border-radius: 22px;
    }

    .shimmer-block::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        border-radius: 999px;
        background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.62) 48%,
                rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer-wave 1.5s ease-in-out infinite;
    }

    @keyframes shimmer-wave {
        100% {
            transform: translateX(100%);
        }
    }

</style>
<body>
<div class="product-grid">
    <div class="product-card product-card--skeleton">
        <div class="product-card__media product-card__media--skeleton">
            <span class="product-card__badge product-card__badge--skeleton shimmer-block" ></span>
            <div class="product-skeleton__image shimmer-block" ></div>
        </div>
    </div>
    <div class="product-card product-card--skeleton">
        <div class="product-card__media product-card__media--skeleton">
            <span class="product-card__badge product-card__badge--skeleton shimmer-block" ></span>
            <div class="product-skeleton__image shimmer-block" ></div>
        </div>
    </div>
    <div class="product-card product-card--skeleton">
        <div class="product-card__media product-card__media--skeleton">
            <span class="product-card__badge product-card__badge--skeleton shimmer-block" ></span>
            <div class="product-skeleton__image shimmer-block" ></div>
        </div>
    </div>
    <div class="product-card product-card--skeleton">
        <div class="product-card__media product-card__media--skeleton">
            <span class="product-card__badge product-card__badge--skeleton shimmer-block" ></span>
            <div class="product-skeleton__image shimmer-block" ></div>
        </div>
    </div>
</div>
</body>
</html>
