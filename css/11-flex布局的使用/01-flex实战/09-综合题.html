<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    .container {
        width: 700px;
        height: 64px;
        margin: 40px auto;
        border: 1px solid red;

        display: flex;
        align-items: center;
        gap: 10px;
    }

    .item {
        background: skyblue;
    }

    .item:nth-child(1) {
        padding: 8px 16px;
    }

    .item:nth-child(2) {
        flex: 1;
        height: 36px;
        background: #eee;
        display: flex;
        align-items: center;
        padding: 0 12px;
        box-sizing: border-box;
    }

    .item:nth-child(3) {
        display: flex;
        gap: 10px;
    }

    button  {
        height: 36px;
        padding: 0 16px;
    }
</style>
<body>

<div class="container">
    <div class="item">Logo</div>
    <div class="item">搜索框</div>
    <div class="item">
        <button>登录</button>
        <button>注册</button>
    </div>
</div>

</body>
<script>
</script>
</html>
