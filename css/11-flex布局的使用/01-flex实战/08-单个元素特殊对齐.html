<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    .container {
        width: 700px;
        height: 300px;
        margin: 40px auto;
        border: 1px solid red;
        display: flex;
        align-items: flex-end;
        gap: 16px;
    }
    .item {
        background: skyblue;
        flex: 1;
        text-align: center;
        line-height: 80px
    }

    .item:nth-child(1) {
        height: 80px;
    }

    .item:nth-child(2) {
        height: 140px;
    }

    .item:nth-child(3) {
        height: 110px;
    }

    .item:nth-child(4) {
        height: 90px;
        align-self: flex-start;
        background: orange;
    }

</style>
<body>

<div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
</div>

</body>
<script>
</script>
</html>
