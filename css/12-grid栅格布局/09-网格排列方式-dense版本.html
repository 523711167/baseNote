<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-auto-rows: 60px;
            gap: 10px;

            grid-auto-flow: row;
            /* 改成 row dense 对比看看 */
            /* grid-auto-flow: row dense; */
        }

        .item {
            background: skyblue;
            border: 1px solid #333;
        }

        .item1 {
            grid-column: span 2;
        }

        .item2 {
            grid-column: span 2;
        }

    </style>
</head>
<body>

<div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
</div>


</body>
<script>
<!---->
// 我们之前有说到.占位的说法，在我们排列网格的时候，当指定某个网格的排列方式，是因为排列不下，自动换行的情况，就会在排列最初的位置留下占位，那么后续元素排列就会跳过
// 只有使用dense属性，才会将后续元素排列到对应.占位位置
</script>
</html>
